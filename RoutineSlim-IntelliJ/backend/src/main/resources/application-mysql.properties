# Only loaded when the mysql profile is selected.
spring.config.import=optional:file:./application-mysql-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:routineslim}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&sslMode=PREFERRED}
spring.datasource.username=${DB_USERNAME:routineslim}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
